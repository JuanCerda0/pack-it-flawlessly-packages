spring.application.name=pack-it-backend
server.port=${PORT:8080}

spring.datasource.url=${PACKIT_DB_URL:jdbc:postgresql://localhost:5432/packit_packages}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.username=${PACKIT_DB_USERNAME:postgres}
spring.datasource.password=${PACKIT_DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

spring.rabbitmq.host=${PACKIT_RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${PACKIT_RABBITMQ_PORT:5672}
spring.rabbitmq.username=${PACKIT_RABBITMQ_USERNAME:guest}
spring.rabbitmq.password=${PACKIT_RABBITMQ_PASSWORD:guest}
spring.rabbitmq.publisher-confirm-type=correlated
spring.rabbitmq.publisher-returns=true
packit.outbox.publisher.delay-ms=${PACKIT_OUTBOX_PUBLISH_DELAY_MS:5000}
packit.outbox.publisher.batch-size=${PACKIT_OUTBOX_BATCH_SIZE:20}
packit.outbox.publisher.confirm-timeout-ms=${PACKIT_OUTBOX_CONFIRM_TIMEOUT_MS:5000}

spring.security.oauth2.resourceserver.jwt.issuer-uri=${COGNITO_ISSUER_URI:https://cognito-idp.us-east-1.amazonaws.com/us-east-1_vidDVo9o0}

app.cors.allowed-origins=${PACKIT_CORS_ALLOWED_ORIGINS:http://localhost:4200}
